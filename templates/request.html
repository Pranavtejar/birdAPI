<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find a Bird - Chennai Bird API</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", system-ui, sans-serif;
      background: #0a0a0a;
      color: #e4e4e7;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 189, 248, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(168, 85, 247, 0.06), transparent);
    }

    .page {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .header {
      text-align: center;
      padding: 1.5rem 0 0.5rem;
    }

    .header .icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      display: block;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fafafa;
      letter-spacing: -0.02em;
    }

    .header p {
      font-size: 0.875rem;
      color: #71717a;
      margin-top: 0.35rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 1.75rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a1a1aa;
      margin-bottom: 1.25rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .field label {
      font-size: 0.8rem;
      font-weight: 500;
      color: #a1a1aa;
    }

    .field input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      outline: none;
      padding: 0.75rem 0.875rem;
      border-radius: 10px;
      color: #fafafa;
      font-size: 0.9rem;
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }

    .field input::placeholder {
      color: #52525b;
    }

    .field input:focus {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0a0a0a;
      margin-top: 0.25rem;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #d4d4d8;
      width: 100%;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
    }

    #result {
      margin-top: 1rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 0.4s ease forwards;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <span class="icon">&#x1F50D;</span>
      <h1>Find a Bird</h1>
      <p>Search for a bird sighting by name</p>
    </div>

    <div class="card">
      <div class="card-title">Search</div>
      <form hx-post="/findbird" hx-target="#result" hx-swap="innerHTML">
        <div class="field">
          <label for="birdName">Bird Name</label>
          <input type="text" id="birdName" name="birdName" placeholder="e.g. Indian Peafowl" required>
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
      </form>
      <div id="result"></div>
    </div>

    <a href="/" class="btn btn-ghost">&#8592; Back to Home</a>
  </div>
</body>
</html>
