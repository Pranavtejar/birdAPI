<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chennai Bird API</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", system-ui, sans-serif;
      background: #0a0a0a;
      color: #e4e4e7;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 189, 248, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(168, 85, 247, 0.06), transparent);
    }

    .page {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .header {
      text-align: center;
      padding: 1.5rem 0 0.5rem;
    }

    .header .icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      display: block;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fafafa;
      letter-spacing: -0.02em;
    }

    .header p {
      font-size: 0.875rem;
      color: #71717a;
      margin-top: 0.35rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 1.75rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a1a1aa;
      margin-bottom: 1.25rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .field label {
      font-size: 0.8rem;
      font-weight: 500;
      color: #a1a1aa;
    }

    .field input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      outline: none;
      padding: 0.75rem 0.875rem;
      border-radius: 10px;
      color: #fafafa;
      font-size: 0.9rem;
      font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }

    .field input::placeholder {
      color: #52525b;
    }

    .field input:focus {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #0a0a0a;
      margin-top: 0.25rem;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #d4d4d8;
      width: 100%;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .btn-ghost .arrow {
      transition: transform 0.2s;
    }

    .btn-ghost:hover .arrow {
      transform: translateX(3px);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: #3f3f46;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
    }

    .findbird-section {
      min-height: 0;
      transition: all 0.3s ease;
    }

    .success-toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      background: #22c55e;
      color: #0a0a0a;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      box-shadow: 0 8px 30px rgba(34, 197, 94, 0.3);
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) translateY(20px);
      transition: opacity 0.4s, visibility 0.4s, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .success-toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .htmx-indicator {
      display: none;
    }

    .htmx-request .htmx-indicator {
      display: inline-block;
    }

    .htmx-request.htmx-indicator {
      display: inline-block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 0.4s ease forwards;
    }

    .result-card {
      padding: 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .result-card.found {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.15);
    }

    .result-card.not-found {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }

    .result-label {
      font-size: 0.75rem;
      color: #71717a;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .result-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fafafa;
    }

    .result-detail {
      font-size: 0.85rem;
      color: #a1a1aa;
      margin-top: 0.25rem;
    }

    .result-detail strong {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <span class="icon">&#x1F426;</span>
      <h1>Chennai Bird API</h1>
      <p>Track and discover bird sightings</p>
    </div>

    <div class="card">
      <div class="card-title">Log a Sighting</div>
      <form hx-post="/" hx-swap="none" hx-on="htmx:afterRequest: this.reset()">
        <div class="field">
          <label for="birdName">Bird Name</label>
          <input type="text" id="birdName" name="birdName" placeholder="e.g. Indian Peafowl" required>
        </div>
        <div class="field">
          <label for="location">Location</label>
          <input type="text" id="location" name="location" placeholder="e.g. Marina Beach" required>
        </div>
        <button type="submit" class="btn btn-primary">
          <span class="htmx-indicator" style="margin-right:0">...</span>
          Submit Sighting
        </button>
      </form>
    </div>

    <div class="divider">or</div>

    <button
      class="btn btn-ghost"
      hx-get="/findbird"
      hx-target="#findbird-section"
      hx-swap="innerHTML"
      hx-indicator="#findbird-loading"
    >
      <span id="findbird-loading" class="htmx-indicator" style="font-size:0.8rem">Loading...</span>
      <span class="htmx-indicator">Find a Bird</span>
      <span class="arrow">&#8594;</span>
    </button>

    <div id="findbird-section" class="findbird-section"></div>
  </div>

  <div id="toast" class="success-toast">Sighting logged!</div>

  <script>
    document.body.addEventListener("htmx:afterRequest", function(e) {
      if (e.detail.pathInfo?.requestPath === "/" && e.detail.requestConfig.verb === "post") {
        var toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(function() { toast.classList.remove("show"); }, 2500);
      }
    });
  </script>
</body>
</html>
